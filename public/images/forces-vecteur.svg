<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <style>
    .bg { fill: #f8fafc; rx: 8px; }
    .title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #1e293b; }
    .box { fill: #cbd5e1; rx: 4px; }
    .vector { stroke: #3b82f6; stroke-width: 4; marker-end: url(#arrow); }
    .text-vec { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #3b82f6; }
    .desc { font-family: sans-serif; font-size: 11px; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="500" height="160" class="bg"/>
  <text x="25" y="25" class="title">Modélisation d'une force par un vecteur</text>

  <!-- Objet -->
  <rect x="150" y="65" width="80" height="50" class="box"/>
  <text x="175" y="95" font-family="sans-serif" font-size="12px" fill="#1e293b" font-weight="bold">Objet</text>

  <!-- Vecteur Force -->
  <line x1="230" y1="90" x2="380" y2="90" class="vector"/>
  
  <!-- F avec sa flèche vectorielle propre dessine en SVG -->
  <text x="295" y="78" class="text-vec">F</text>
  <path d="M 294 68 L 304 68 M 301 65 L 304 68 L 301 71" stroke="#3b82f6" stroke-width="1.5" fill="none"/>

  <!-- Légendes des points caractéristiques -->
  <circle cx="230" cy="90" r="4" fill="#ef4444"/>
  <text x="210" y="130" class="desc">• Point d'application</text>
  <text x="350" y="130" class="desc">• Intensité (Valeur en N)</text>
</svg>

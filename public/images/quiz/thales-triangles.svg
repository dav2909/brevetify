<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Fond blanc propre -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Lignes des sécantes partant de A -->
  <line x1="80" y1="50" x2="350" y2="250" stroke="#4f46e5" stroke-width="2.5" />
  <line x1="80" y1="50" x2="200" y2="270" stroke="#4f46e5" stroke-width="2.5" />

  <!-- Droites parallèles (BC) et (MN) -->
  <!-- Segment BC (le plus petit, en haut) -->
  <line x1="130" y1="110" x2="215" y2="120" stroke="#0284c7" stroke-width="3" />
  <!-- Segment MN (le plus grand, en bas) -->
  <line x1="180" y1="190" x2="300" y2="205" stroke="#0284c7" stroke-width="3" />

  <!-- Points -->
  <circle cx="80" cy="50" r="4" fill="#1e1b4b" />
  <circle cx="130" cy="110" r="4" fill="#1e1b4b" />
  <circle cx="180" cy="190" r="4" fill="#1e1b4b" />
  <circle cx="215" cy="120" r="4" fill="#1e1b4b" />
  <circle cx="300" cy="205" r="4" fill="#1e1b4b" />

  <!-- Étiquettes des points (lettres) -->
  <text x="65" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e1b4b">A</text>
  <text x="110" y="105" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284c7">B</text>
  <text x="158" y="195" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284c7">M</text>
  <text x="225" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284c7">C</text>
  <text x="312" y="210" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0284c7">N</text>

  <!-- Petites indications de longueurs / parallèles -->
  <text x="135" y="75" font-family="sans-serif" font-style="italic" font-size="13" fill="#64748b">3 cm</text>
  <text x="110" y="150" font-family="sans-serif" font-style="italic" font-size="13" fill="#64748b">7,5 cm</text>
  <text x="160" y="105" font-family="sans-serif" font-style="italic" font-size="13" fill="#64748b">2 cm</text>
</svg>

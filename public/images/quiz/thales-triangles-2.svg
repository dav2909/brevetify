<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Styles -->
  <style>
    .line { stroke: #4f46e5; stroke-width: 2; fill: none; }
    .parallel { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 4,4; }
    .point { fill: #4f46e5; }
    .label { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .measure { font-family: sans-serif; font-size: 12px; fill: #0369a1; }
  </style>

  <!-- Triangle principal / Lignes sécantes -->
  <path d="M 60 40 L 220 240 M 60 40 L 320 180" class="line" />
  
  <!-- Droites parallèles (segment BC et MN) -->
  <line x1="125" y1="120" x2="195" y2="110" class="parallel" />
  <line x1="170" y1="180" x2="280" y2="165" class="parallel" />

  <!-- Points -->
  <circle cx="60" cy="40" r="4" class="point" />
  <circle cx="125" cy="120" r="3" class="point" />
  <circle cx="195" cy="110" r="3" class="point" />
  <circle cx="170" cy="180" r="3" class="point" />
  <circle cx="280" cy="165" r="3" class="point" />

  <!-- Étiquettes des points -->
  <text x="40" y="38" class="label">A</text>
  <text x="105" y="118" class="label">B</text>
  <text x="205" y="105" class="label">C</text>
  <text x="150" y="195" class="label">M</text>
  <text x="290" y="160" class="label">N</text>

  <!-- Mesures -->
  <text x="75" y="85" class="measure">4 cm</text>
  <text x="110" y="155" class="measure">6 cm</text>
  <text x="145" y="75" class="measure">5 cm</text>
</svg>

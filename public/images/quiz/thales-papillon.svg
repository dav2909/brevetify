<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Styles -->
  <style>
    .line { stroke: #4f46e5; stroke-width: 2; fill: none; }
    .parallel { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 4,4; }
    .point { fill: #4f46e5; }
    .label { font-family: sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
    .measure { font-family: sans-serif; font-size: 12px; fill: #0369a1; }
  </style>

  <!-- Lignes sécantes qui se croisent en O -->
  <path d="M 80 60 L 320 240 M 80 240 L 320 60" class="line" />
  
  <!-- Droites parallèles (segments AB et CD) -->
  <line x1="120" y1="90" x2="280" y2="90" class="parallel" />
  <line x1="120" y1="210" x2="280" y2="210" class="parallel" />

  <!-- Points d'intersection / sommets -->
  <circle cx="200" cy="150" r="4" class="point" />
  <circle cx="140" cy="90" r="3" class="point" />
  <circle cx="260" cy="90" r="3" class="point" />
  <circle cx="140" cy="210" r="3" class="point" />
  <circle cx="260" cy="210" r="3" class="point" />

  <!-- Étiquettes des points -->
  <text x="190" y="170" class="label">O</text>
  <text x="130" y="75" class="label">A</text>
  <text x="255" y="75" class="label">B</text>
  <text x="130" y="235" class="label">C</text>
  <text x="255" y="235" class="label">D</text>

  <!-- Mesures indicatives -->
  <text x="155" y="115" class="measure">3 cm</text>
  <text x="215" y="115" class="measure">4 cm</text>
  <text x="155" y="190" class="measure">6 cm</text>
</svg>

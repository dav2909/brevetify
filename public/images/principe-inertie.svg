<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <style>
    .bg { fill: #f8fafc; rx: 8px; }
    .title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #1e293b; }
    .box { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.5; rx: 4px; }
    .vec-up { stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-b); }
    .vec-down { stroke: #dc2626; stroke-width: 3; marker-end: url(#arrow-r); }
    .txt { font-family: sans-serif; font-size: 12px; fill: #1e293b; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="500" height="200" class="bg"/>
  <text x="25" y="25" class="title">Forces qui se compensent (Principe d'inertie)</text>

  <!-- Système -->
  <rect x="180" y="90" width="80" height="40" class="box"/>
  <text x="198" y="115" class="txt">Système</text>

  <!-- Réaction R vers le haut -->
  <line x1="220" y1="90" x2="220" y2="35" class="vec-up"/>
  <text x="238" y="65" font-family="sans-serif" font-size="13px" fill="#2563eb" font-weight="bold">Réaction (R )</text>
  <!-- Flèche parfaitement alignée sur le R de Réaction -->
  <path d="M 318 55 L 325 55 M 322 52 L 325 55 L 322 58" stroke="#2563eb" stroke-width="1.3" fill="none"/>

  <!-- Poids P vers le bas -->
  <line x1="220" y1="130" x2="220" y2="185" class="vec-down"/>
  <text x="238" y="160" font-family="sans-serif" font-size="13px" fill="#dc2626" font-weight="bold">Poids (P )</text>
  <!-- Flèche parfaitement alignée sur le P de Poids -->
  <path d="M 299 150 L 306 150 M 303 147 L 306 150 L 303 153" stroke="#dc2626" stroke-width="1.3" fill="none"/>

  <!-- Note explicative et formule vectorielle -->
  <text x="300" y="85" font-family="sans-serif" font-size="12px" fill="#475569">
    <tspan x="300" dy="0">Forces opposées</tspan>
    <tspan x="300" dy="18">de même valeur :</tspan>
  </text>
  
  <text x="300" y="140" font-family="sans-serif" font-size="14px" font-weight="bold" fill="#1e293b">P + R = 0</text>
  <!-- Flèche sur le P de la formule -->
  <path d="M 300 128 L 306 128 M 303 125 L 306 128 L 303 131" stroke="#1e293b" stroke-width="1.2" fill="none"/>
  <!-- Flèche sur le R de la formule -->
  <path d="M 338 128 L 344 128 M 341 125 L 344 128 L 341 131" stroke="#1e293b" stroke-width="1.2" fill="none"/>
</svg>

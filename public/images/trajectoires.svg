<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <style>
    .bg { fill: #f8fafc; rx: 8px; }
    .title { font-family: sans-serif; font-weight: bold; font-size: 14px; fill: #1e293b; }
    .label { font-family: sans-serif; font-size: 12px; fill: #475569; }
    .line-rect { stroke: #3b82f6; stroke-width: 3; stroke-dasharray: 6,6; }
    .path-circ { fill: none; stroke: #10b981; stroke-width: 3; stroke-dasharray: 6,6; }
    .path-curv { fill: none; stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 6,6; }
    .obj { fill: #ef4444; }
  </style>
  <rect width="600" height="200" class="bg"/>

  <!-- 1. Rectiligne -->
  <text x="30" y="35" class="title">1. Trajectoire Rectiligne</text>
  <line x1="30" y1="70" x2="160" y2="70" class="line-rect"/>
  <circle cx="150" cy="70" r="6" class="obj"/>
  <text x="30" y="100" class="label">Ex: Skieur en ligne droite</text>

  <!-- 2. Circulaire -->
  <text x="230" y="35" class="title">2. Trajectoire Circulaire</text>
  <circle cx="295" cy="75" r="25" class="path-circ"/>
  <circle cx="320" cy="75" r="6" class="obj"/>
  <text x="220" y="125" class="label">Ex: Grande roue</text>

  <!-- 3. Curviligne -->
  <text x="430" y="35" class="title">3. Trajectoire Curviligne</text>
  <path d="M 430 90 Q 480 40 540 80" class="path-curv"/>
  <circle cx="535" cy="76" r="6" class="obj"/>
  <text x="420" y="125" class="label">Ex: Balle de tennis en l'air</text>
</svg>
